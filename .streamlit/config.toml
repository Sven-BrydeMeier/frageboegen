[theme]
primaryColor = "#b45309"
backgroundColor = "#fffbeb"
secondaryBackgroundColor = "#fef3c7"
textColor = "#1c1917"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
